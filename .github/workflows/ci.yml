name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -v

  agent-integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Start postgres
        run: |
          docker network create postgres-net
          docker run -d --name it-postgres --network postgres-net \
            -e POSTGRES_USER=pgadmin -e POSTGRES_PASSWORD=itpass postgres:16-alpine
          for i in $(seq 1 30); do docker exec it-postgres pg_isready -U pgadmin && break; sleep 1; done
      - run: uv sync --frozen
      - run: uv run pytest -m integration -v
        env:
          VPSCP_IT_PG_CONTAINER: it-postgres
          VPSCP_IT_PG_PASSWORD: itpass

  backup:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stack/backup
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh

  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: |
          cp stack/.env.example stack/.env
          cp stack/panel.env.example stack/panel.env
          docker compose -f stack/docker-compose.yml config -q
      - name: Build backup image
        run: docker build -t vpscp-backup stack/backup
      - name: Backup image uses PostgreSQL 16 client
        shell: bash
        run: docker run --rm --entrypoint pg_dumpall vpscp-backup --version | grep -E 'PostgreSQL\) 16\.'

  panel-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -v

  panel-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest --run
      - run: npm run build

  panel-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build panel image
        run: docker build -t vpscp-panel:local panel
      - id: dockerhub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.dockerhub.outputs.push == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.dockerhub.outputs.push == 'true'
      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.dockerhub.outputs.push == 'true'
        with:
          context: panel
          file: panel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vps-control-panel:main-${{ steps.dockerhub.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vps-control-panel:latest
