name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -v

  nginx-golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: nginx -t on golden site configs
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/conf.d" "$work/certs/example.com" "$work/certs/example.org"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$work/certs/example.com/privkey.pem" \
            -out "$work/certs/example.com/fullchain.pem" \
            -subj "/CN=example.com" 2>/dev/null
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$work/certs/example.org/privkey.pem" \
            -out "$work/certs/example.org/fullchain.pem" \
            -subj "/CN=example.org" 2>/dev/null
          for name in spa strava root_www panel; do
            sed \
              -e 's|/etc/letsencrypt/live/example.com/|/etc/certs/example.com/|g' \
              -e 's|/etc/letsencrypt/live/example.org/|/etc/certs/example.org/|g' \
              "agent/tests/golden/${name}.conf" > "$work/conf.d/${name}.conf"
          done
          cat > "$work/nginx.conf" <<'EOF'
          events {}
          http {
            include /etc/nginx/conf.d/*.conf;
          }
          EOF
          docker run --rm \
            -v "$work/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$work/conf.d:/etc/nginx/conf.d:ro" \
            -v "$work/certs:/etc/certs:ro" \
            nginx:1.24 nginx -t

  agent-integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Start postgres
        run: |
          docker network create postgres-net
          docker run -d --name it-postgres --network postgres-net \
            -e POSTGRES_USER=pgadmin -e POSTGRES_PASSWORD=itpass postgres:16-alpine
          for i in $(seq 1 30); do docker exec it-postgres pg_isready -U pgadmin && break; sleep 1; done
      - run: uv sync --frozen
      - run: uv run pytest -m integration -v
        env:
          VPSCP_IT_PG_CONTAINER: it-postgres
          VPSCP_IT_PG_PASSWORD: itpass

  backup:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stack/backup
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: uvx --from shellcheck-py shellcheck -x install.sh update.sh lib/common.sh

  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: |
          cp stack/.env.example stack/.env
          cp stack/panel.env.example stack/panel.env
          docker compose -f stack/docker-compose.yml config -q
      - name: Build backup image
        run: docker build -t vpscp-backup stack/backup
      - name: Backup image uses PostgreSQL 16 client
        shell: bash
        run: docker run --rm --entrypoint pg_dumpall vpscp-backup --version | grep -E 'PostgreSQL\) 16\.'

  panel-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -v

  panel-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest --run
      - run: npm run build

  panel-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build panel image
        run: docker build -t vpscp-panel:local panel
      - id: dockerhub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.dockerhub.outputs.push == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.dockerhub.outputs.push == 'true'
      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.dockerhub.outputs.push == 'true'
        with:
          context: panel
          file: panel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vps-control-panel:main-${{ steps.dockerhub.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vps-control-panel:latest
