[project]
name = "vpscp-agent"
version = "0.1.0"
description = "Privileged host agent for vps-control-panel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "psutil>=6.1",
    "cryptography>=43.0",
    "jinja2>=3.1",
]

[project.scripts]
vpscp-agent = "vpscp_agent.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "httpx2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vpscp_agent"]

[tool.hatch.build.targets.wheel.force-include]
"vpscp_agent/templates" = "vpscp_agent/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real postgres container",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
