[project]
name = "vpscp-panel"
version = "0.1.0"
description = "Web panel for vps-control-panel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43.0",
    "httpx>=0.27",
    "qrcode>=8.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "httpx2",
    "ruff>=0.8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vpscp_panel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
