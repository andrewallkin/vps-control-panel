[project]
name = "vpscp-backup"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-storage>=2.10.0",
    "apscheduler>=3.10.0,<4",
    "pyrage>=1.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
