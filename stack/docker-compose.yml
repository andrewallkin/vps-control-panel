name: vpscp

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-central
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - postgres-net

  backup:
    build:
      context: ./backup
    image: vpscp-backup:local
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_STATE_DIR: /state
    volumes:
      - /var/lib/vpscp/backup:/state
      - /srv/apps:/sources/apps:ro
      - ./.env:/sources/stack/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-net

  panel:
    build:
      context: ../panel
    image: vpscp-panel:local
    restart: always
    env_file: panel.env
    group_add:
      - "${VPSCP_GID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /run/vpscp:/run/vpscp
      - panel_data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  panel_data:

networks:
  postgres-net:
    external: true
